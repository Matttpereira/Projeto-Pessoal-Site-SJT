<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site da Paróquia São Judas Tadeu, no bairro Campestre, em Santo André - SP.">
    <title>Paróquia São Judas Tadeu - Santo André</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <section class="imagem-fundo">
        <a href="index.html">
            <img src="img/logo.png" width="725" height="146" alt="Paróquia São Judas Tadeu - página inicial">
        </a>
    </section>

    <!-- O menu é colocado aqui pelo js/components.js -->

    <main class="conteudo">
        <ul class="cartoes">
            <li>
                <a class="cartao" href="paroquia.html">
                    <img src="img/cartao-paroquia.jpg" alt="">
                    <span class="cartao-titulo">Nossa Paróquia</span>
                </a>
            </li>
            <li>
                <a class="cartao" href="horarios.html">
                    <img src="img/cartao-missa.jpg" alt="">
                    <span class="cartao-titulo">Horários</span>
                </a>
            </li>
            <li>
                <a class="cartao" href="padroeiro.html">
                    <img class="foto-esquerda" src="img/cartao-padroeiro.jpg" alt="">
                    <span class="cartao-titulo">Nosso Padroeiro</span>
                </a>
            </li>
            <li>
                <a class="cartao" href="pastorais.html">
                    <img src="img/cartao-fachada.jpg" alt="">
                    <span class="cartao-titulo">Pastorais</span>
                </a>
            </li>
            <li>
                <a class="cartao" href="dizimo.html">
                    <img src="img/cartao-missa.jpg" alt="">
                    <span class="cartao-titulo">Dízimo</span>
                </a>
            </li>
        </ul>
    </main>

    <script src="js/components.js"></script>
</body>

</html>
